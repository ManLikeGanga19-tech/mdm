# Noahport MDM — local development stack. Start: docker compose up -d   Admin site: http://localhost:8080/admin
# (also from a phone on the same Wi-Fi: http://<this PC's LAN IP>:8080/admin).
# The backend source is bind-mounted; vendor/ lives in a named volume so Composer's thousands of files stay fast and
# out of OneDrive. Production (Contabo) gets its own compose file under deploy/ in Phase 6 work.
name: noahport-mdm

x-app: &app
  image: noahport-mdm-app:dev
  build:
    context: deploy/docker
    dockerfile: app.Dockerfile
  volumes:
    - ./backend:/app
    - vendor:/app/vendor
  # Real-time hub (FrankenPHP's Mercure, see the app command). Development-only keys; production's are in deploy/.env.
  environment:
    MERCURE_PUBLISHER_JWT_KEY: dev-only-publisher-key-0123456789abcdef
    MERCURE_SUBSCRIBER_JWT_KEY: dev-only-subscriber-key-0123456789abcdef
    MERCURE_RESOURCE_IDENTIFIER: ${MERCURE_RESOURCE_IDENTIFIER:-http://localhost:8080/.well-known/mercure} # a tunnel address when testing phones
    MERCURE_TRUSTED_ISSUERS: noahport-mdm
    MERCURE_INTERNAL_URL: http://app/.well-known/mercure
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app
    ports:
      - "8080:80"
    # FrankenPHP serves public/ over plain HTTP in development; TLS is the VPS reverse proxy's job.
    command: frankenphp php-server --listen :80 --root /app/public --mercure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/up"]
      interval: 15s
      retries: 3

  horizon:
    <<: *app
    command: php artisan horizon
    healthcheck:
      disable: true # the image's check probes the web server, which only the app service runs

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      disable: true

  # Temporary public https address for the admin site until the VPS is set up:
  #   docker compose --profile tunnel up -d tunnel
  #   docker compose logs tunnel   (look for https://<random>.trycloudflare.com; it changes on every restart)
  tunnel:
    image: cloudflare/cloudflared:2026.9.0
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:80
    depends_on:
      - app

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: mdm
      POSTGRES_USER: mdm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mdm-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdm -d mdm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    volumes:
      - redisdata:/data

volumes:
  vendor:
  pgdata:
  redisdata:
